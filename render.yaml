services:
  - type: web
    name: raviraj-exports
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MARKET_DATA_FILE
        value: /var/data/market-report.json
    disk:
      name: market-data
      mountPath: /var/data
      sizeGB: 1
